name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate014-fixture-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate014:fixtures:verify

  gate014-b1-artifacts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify historical B1 snapshot (not current performance)
        run: node scripts/verify-gate-014-b1-history.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qa.txt
      - run: npm ci
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/dev-build.mjs --smoke
      - run: npm run build
      - run: ./scripts/package-release.ps1
        shell: pwsh
      - run: npm run qa:preference-word-cloud
        env:
          BILI_BILL_REAL_MOCK_QA_SKIP_BUILD: "1"
      - run: npm run qa:sidebar-card
        env:
          BILI_BILL_REAL_MOCK_QA_SKIP_BUILD: "1"
      - run: npm audit

  acceptance-tools:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/acceptance/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/acceptance
      - run: npm run test:acceptance
      - run: npm audit --prefix packages/acceptance

  codex-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix packages/codex-knowledge
      - run: npm test --prefix packages/codex-knowledge
      - run: npm run build --prefix packages/codex-knowledge
      - run: npm audit --prefix packages/codex-knowledge
